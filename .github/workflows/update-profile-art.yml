name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}

concurrency:
  group: profile-art
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_contributions.py
        env:
          GH_USERNAME: surya-tejaN
          GH_CONTRIBUTIONS_PAT: ${{ secrets.GH_CONTRIBUTIONS_PAT }}
      - run: python scripts/render_heatmap_svg.py
      - name: Commit and push heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --staged --quiet; then
            echo "No heatmap changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh contribution graph [skip ci]"
          git pull --rebase origin main
          git push origin main
